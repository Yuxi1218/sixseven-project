<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css?v=12">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>機翼損傷檢測系統</title>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">機翼損傷檢測系統</h1>
            <div class="status-bar">
                <span id="status-indicator" class="status offline"></span>
                <span id="status-text">連線中...</span>
            </div>
        </header>

        <main>
            <div class="video-section">
                <video id="camera" autoplay playsinline muted style="display:none;"></video>
                <video id="remote" autoplay playsinline muted style="display:none;"></video>
                <img id="stream" alt="串流">
                <canvas id="overlay"></canvas>
            </div>

            <div id="fps-warning" class="fps-warning" style="display:none;">
                ⚠️ 幀率過低（&lt;10 FPS），畫面可能不流暢
            </div>

            <div class="controls">
                <button id="btn-live" class="btn danger">關閉即時診斷</button>
                <button id="btn-diagnose" class="btn success">開始診斷</button>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <span class="label">FPS:</span>
                    <span id="fps-display">0</span>
                </div>
                <div class="info-item">
                    <span class="label">模式:</span>
                    <span id="mode-display">即時診斷</span>
                </div>
                <div class="info-item">
                    <span class="label">偵測:</span>
                    <span id="detection-count">0</span>
                </div>
            </div>

            <div id="diagnosis-result" class="diagnosis-panel" style="display:none;">
                <h3>診斷結果</h3>
                <div id="diagnosis-content"></div>
                <button id="btn-close-diagnosis" class="btn primary">繼續拍攝</button>
            </div>

            <div id="webrtc-debug" class="webrtc-debug" style="display:none;"></div>

        </main>

        <footer>
            <p>sixseven-project of AirCraft / ver.Qi202609080153</p>
        </footer>
    </div>

    <script src="/static/app.js?v=15"></script>
</body>
</html>
